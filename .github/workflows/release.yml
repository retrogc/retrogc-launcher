name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Validate version
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: ${{ inputs.version }}"
            echo "Version must be in the form X.Y.Z (for example 1.0.0)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore RetroGameCard.csproj

      - name: Publish Linux
        run: >
          dotnet publish RetroGameCard.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          --output publish/linux
          -p:PublishReadyToRun=true
          -p:PublishTrimmed=true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:Version=${{ inputs.version }}

      - name: Publish Windows
        run: >
          dotnet publish RetroGameCard.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish/windows
          -p:PublishReadyToRun=true
          -p:PublishTrimmed=true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:Version=${{ inputs.version }}

      - name: Create Linux ZIP
        run: |
          mkdir -p release
          cd publish/linux
          zip ../../release/retrogc-launcher-linux.zip retrogc-launcher

      - name: Create Windows ZIP
        run: |
          cd publish/windows
          zip ../../release/retrogc-launcher-windows.zip retrogc-launcher.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: RetroGC Launcher v${{ inputs.version }}
          generate_release_notes: true
          files: |
            release/retrogc-launcher-linux.zip
            release/retrogc-launcher-windows.zip

      # Builds the installer card for this launcher version (retrogc-installer: installer.yml).
      # INSTALLER_DISPATCH_TOKEN: fine-grained token for retrogc/retrogc-installer, Actions read/write.
      - name: Trigger installer release
        env:
          GH_TOKEN: ${{ secrets.INSTALLER_DISPATCH_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::warning::INSTALLER_DISPATCH_TOKEN is not set: run 'Build Installer' in retrogc-installer by hand."
            exit 0
          fi
          gh workflow run installer.yml -R retrogc/retrogc-installer --ref main \
            -f launcher_version=${{ inputs.version }}
          echo "Installer release started: https://github.com/retrogc/retrogc-installer/actions/workflows/installer.yml"